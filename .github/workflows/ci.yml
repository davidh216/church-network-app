name: CI

on:
  push:
    branches: [main, 'modernize/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No git hooks in CI.
  HUSKY: '0'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: church
          POSTGRES_PASSWORD: church
          POSTGRES_DB: church_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U church -d church_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The backend imports @embrace/shared from its compiled dist.
      - run: npm run build:shared
      - run: npm run -w @embrace/shared typecheck
      - run: npm run -w @embrace/shared lint
      - run: npm run -w @embrace/shared test
      - run: npm run -w backend typecheck
      - run: npm run -w backend lint
      # vitest.config.mts points DATABASE_URL at church_test on localhost:5432.
      - run: npm run -w backend test
      - run: npm run -w backend build
      # The container entrypoint runs the compiled seed before the server.
      - name: Compiled seed runs
        run: node backend/dist/prisma/seed.js
        env:
          DATABASE_URL: postgresql://church:church@localhost:5432/church_test?schema=public
      # Replays the migrations into the shadow database (wiped first; never the DATABASE_URL
      # database) and compares the result with schema.prisma. Exit code 2 means drift.
      - name: Migrations match schema.prisma
        run: >-
          npx -w backend prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema prisma/schema.prisma
          --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://church:church@localhost:5432/church_test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      # Prettier over the whole repository (backend included).
      - run: npm run format:check
      - run: npm run -w frontend typecheck
      - run: npm run -w frontend lint
      - run: npm run -w frontend test
      - run: npm run -w frontend build

  e2e:
    name: E2E
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: church
          POSTGRES_PASSWORD: church
          POSTGRES_DB: church_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U church -d church_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://church:church@localhost:5432/church_dev?schema=public
      SEED_ADMIN_EMAIL: e2e-admin@example.com
      SEED_ADMIN_NAME: E2E Admin
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Throwaway JWT secret and admin password
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 16)"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          {
            echo "JWT_SECRET=$jwt_secret"
            echo "SEED_ADMIN_PASSWORD=$admin_password"
          } >> "$GITHUB_ENV"
      - run: npx -w frontend playwright install --with-deps chromium
      - run: npm run -w backend db:migrate
      # Seeds the admin (global setup), starts both dev servers and runs every spec in
      # frontend/e2e (smoke, attendance flow).
      - run: npm run -w frontend test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      # Restore drill (decision P4-D7): back up church_dev (migrated, seeded and used by the e2e
      # run) with scripts/db-backup.sh, restore it into a fresh database with
      # scripts/db-restore.sh, then check the migration history and every table's row count.
      - name: Backup and restore drill
        shell: bash
        run: |
          pg_dump --version
          backup_dir="$RUNNER_TEMP/backups"
          scripts/db-backup.sh "$backup_dir"
          dump="$(find "$backup_dir" -name 'church-*.dump' | sort | tail -n 1)"
          server=postgresql://church:church@localhost:5432
          psql "$server/church_dev" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE church_restore'
          scripts/db-restore.sh "$dump" church_restore
          DATABASE_URL="$server/church_restore?schema=public" npx -w backend prisma migrate status \
            | tee "$RUNNER_TEMP/migrate-status"
          grep -q 'Database schema is up to date' "$RUNNER_TEMP/migrate-status"
          # Exact row counts of every table, the migration history included.
          row_counts() {
            psql "$1" -At -v ON_ERROR_STOP=1 \
              -c "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY 1" \
              | while read -r table; do
                  count="$(psql "$1" -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.\"$table\"")"
                  echo "$table $count"
                done
          }
          row_counts "$server/church_dev" >"$RUNNER_TEMP/rows-source"
          row_counts "$server/church_restore" >"$RUNNER_TEMP/rows-restored"
          cat "$RUNNER_TEMP/rows-source"
          grep -Eq '^users [1-9]' "$RUNNER_TEMP/rows-source"
          diff "$RUNNER_TEMP/rows-source" "$RUNNER_TEMP/rows-restored"
          echo "restore drill passed"

  images:
    name: Images and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's default builder (docker driver) keeps the layers, so the compose build
      # below reuses them. API_URL matches the build argument in docker-compose.yml.
      - name: Build the API image
        run: docker buildx build --file backend/Dockerfile --tag church-network-api:ci .
      - name: Build the web image
        run: >-
          docker buildx build --file frontend/Dockerfile
          --build-arg API_URL=http://api:5000 --tag church-network-web:ci .
      # The api service reads backend/.env (docker-compose.yml env_file): a throwaway secret and
      # seed admin, as the README tells operators to set up.
      - name: Throwaway JWT secret and seed admin
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 16)"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          umask 077
          {
            echo "JWT_SECRET=$jwt_secret"
            echo "SEED_ADMIN_EMAIL=ci-admin@example.com"
            echo "SEED_ADMIN_PASSWORD=$admin_password"
          } >backend/.env
          echo "SEED_ADMIN_PASSWORD=$admin_password" >>"$GITHUB_ENV"
      # --wait returns once db, api and web report healthy (each has a healthcheck), and fails
      # if one does not within the timeout.
      - name: Start the compose stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: API health, login page and sign-in through the web app
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:5000/health \
            | tee "$RUNNER_TEMP/health.json"
          echo
          grep -q '"status":"OK"' "$RUNNER_TEMP/health.json"
          curl --fail --silent --show-error --max-time 10 --output /dev/null \
            http://127.0.0.1:3000/login
          # The seeded admin signs in through the Next.js /api rewrite to the api service.
          printf '{"email":"ci-admin@example.com","password":"%s"}' "$SEED_ADMIN_PASSWORD" \
            | curl --fail --silent --show-error --max-time 10 --output /dev/null \
              --header 'Content-Type: application/json' --data-binary @- \
              http://127.0.0.1:3000/api/auth/login
      - name: Refresh CLI in the api image
        run: docker compose run --rm -T --entrypoint node api dist/jobs/refresh-engagement.js
      - name: /health answers 503 within 10 seconds of the database stopping
        shell: bash
        run: |
          docker compose stop db
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 \
            http://127.0.0.1:5000/health || true)"
          echo "GET /health after stopping db: $code"
          test "$code" = 503
      - name: Compose state and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Remove the stack
        if: always()
        run: docker compose down --volumes
