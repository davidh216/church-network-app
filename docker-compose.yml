# Local stack: PostgreSQL 16, the API and the web app.
#   docker compose up -d db       database only, for `npm run dev` on the host
#   docker compose up --build     everything; open http://localhost:3000
# The api service reads JWT_SECRET and SEED_ADMIN_* from backend/.env when that file exists.
name: church-network

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: church
      POSTGRES_PASSWORD: church
      POSTGRES_DB: church_dev
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U church -d church_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '5000'
      DATABASE_URL: postgresql://church:church@db:5432/church_dev?schema=public
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '5000:5000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:5000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Next.js bakes the rewrite destination into the build, so API_URL is a build argument.
      args:
        API_URL: http://api:5000
    environment:
      API_URL: http://api:5000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
