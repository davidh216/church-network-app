# Local stack: PostgreSQL 16, the API and the web app.
#   docker compose up -d db       database only, for `npm run dev` on the host
#   docker compose up --build     everything; open http://localhost:3000
# The api service reads JWT_SECRET and SEED_ADMIN_* from backend/.env when that file exists.
# Ports are published on 127.0.0.1 only; DB_PORT moves PostgreSQL off 5432 on the host.
name: church-network

# The API writes JSON lines to stdout; Docker keeps them in rotated files, so they cannot fill the
# disk (at most 5 files of 10 MB per service). `docker compose logs api` reads them.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  db:
    # Pinned by digest; Dependabot proposes new digests of 16-alpine (.github/dependabot.yml).
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_USER: church
      POSTGRES_PASSWORD: church
      POSTGRES_DB: church_dev
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U church -d church_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '5000'
      DATABASE_URL: postgresql://church:church@db:5432/church_dev?schema=public
      CORS_ORIGIN: http://localhost:3000
      # This stack serves plain HTTP, where a Secure cookie would never be sent back.
      # Deployments behind TLS leave COOKIE_SECURE unset (Secure follows NODE_ENV=production).
      COOKIE_SECURE: 'false'
    ports:
      - '127.0.0.1:5000:5000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:5000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Next.js bakes the rewrite destination into the build, so API_URL is a build argument
      # only; setting it in the container environment would have no effect.
      args:
        API_URL: http://api:5000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/login']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

volumes:
  db-data:
